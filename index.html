<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>LexisCore — Модульная платформа для обучения</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />

            brand: {

              400: '#818cf8',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca'

</head>
<body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 min-h-screen flex flex-col md:flex-row selection:bg-indigo-500/30">

      </button>
      <button data-tab="study" class="nav-btn w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-sm font-medium transition">

    <!-- Sidebar Footer: Daily Goal & Tools -->
    <div class="p-4 border-t border-slate-200 dark:border-slate-800/80 space-y-3">
      <button id="editDailyGoalBtn" type="button" title="Настроить цель на сегодня" class="w-full text-left p-3 rounded-xl bg-slate-100 dark:bg-slate-800/60 hover:bg-slate-200/70 dark:hover:bg-slate-800 transition group">
        <div class="flex items-center justify-between text-xs mb-1.5">
          <span class="text-slate-500 dark:text-slate-400 font-medium flex items-center gap-1">Цель на сегодня <span class="opacity-60 group-hover:opacity-100">✏️</span></span>
          <span id="dailyGoalText" class="font-bold text-indigo-500">0 / 20</span>
        </div>
        <div class="h-2 rounded-full bg-slate-200 dark:bg-slate-700 overflow-hidden">
          <div id="dailyGoalBar" class="h-full bg-gradient-to-r from-indigo-500 to-violet-500 rounded-full transition-all duration-300" style="width: 0%"></div>
        </div>
      </button>
      <div class="grid grid-cols-2 gap-2">
        <button id="openCloudModalBtn" class="px-2.5 py-2 rounded-xl text-xs font-semibold bg-sky-500/10 text-sky-600 dark:text-sky-400 hover:bg-sky-500/20 transition flex items-center justify-center gap-1.5 min-w-0">
          <span class="truncate" id="desktopCloudLabel">☁️ Вход</span>
        </button>
        <button id="openBackupModalBtn" class="px-2.5 py-2 rounded-xl text-xs font-medium bg-slate-200/70 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 transition flex items-center justify-center gap-1.5">
          <span>💾 Бэкап</span>
        </button>
      </div>
    </div>

  <!-- Mobile Top Header -->

    <div class="flex items-center gap-2">
      <div class="w-8 h-8 rounded-xl bg-gradient-to-br from-indigo-500 to-violet-600 flex items-center justify-center text-white shadow-sm">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6.042A8.967 8.967 0 006 3.75c-1.052 0-2.062.18-3 .512v14.25A8.987 8.987 0 016 18c2.305 0 4.408.867 6 2.292m0-14.25a8.966 8.966 0 016-2.292c1.052 0 2.062.18 3 .512v14.25A8.987 8.987 0 0018 18a8.967 8.967 0 00-6 2.292m0-14.25v14.25"/></svg>

        <button id="editDailyGoalMobile" class="text-[10px] text-indigo-500 font-semibold mt-0.5 flex items-center gap-1">Цель: <span id="mobileHeaderGoal">0/20</span> ✏️</button>
      </div>
    </div>
    <div class="flex items-center gap-1">
      <button id="openCloudModalMobile" title="Аккаунт" class="tap-scale px-2.5 py-1.5 rounded-xl bg-sky-500/15 text-sky-600 dark:text-sky-400 text-[11px] font-semibold truncate max-w-[96px]">☁️ Вход</button>
      <button data-tab="favorites" title="Избранное" class="tap-scale px-2 py-1.5 rounded-xl bg-amber-500/10 text-amber-500 text-[11px] font-semibold"><span>Избранное</span></button>
      <button id="openBackupModalMobile" title="Бэкап" class="tap-scale p-1.5 rounded-xl bg-slate-100 dark:bg-slate-800 text-xs">💾</button>
      <button id="openSettingsHeaderMobile" data-tab="settings" title="Настройки" class="tap-scale p-1.5 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 text-xs">⚙️</button>

      </button>
    </div>
  </header>

  <!-- Main Workspace -->
  <main id="mainContent" class="flex-1 overflow-y-auto custom-scroll pb-24 md:pb-8">
    <div id="viewContainer" class="max-w-5xl mx-auto p-4 sm:p-6 lg:p-8"></div>
  </main>

  <nav id="mobileNav" class="md:hidden fixed bottom-0 inset-x-0 z-30 bg-white/95 dark:bg-slate-900/95 border-t border-slate-200 dark:border-slate-800 grid grid-cols-6 gap-0.5 px-1 pt-1.5 safe-bottom">

      <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6A2.25 2.25 0 016 3.75h2.25A2.25 2.25 0 0110.5 6v2.25a2.25 2.25 0 01-2.25 2.25H6a2.25 2.25 0 01-2.25-2.25V6zM3.75 15.75A2.25 2.25 0 016 13.5h2.25a2.25 2.25 0 012.25 2.25V18a2.25 2.25 0 01-2.25 2.25H6A2.25 2.25 0 013.75 18v-2.25zM13.5 6a2.25 2.25 0 012.25-2.25H18A2.25 2.25 0 0120.25 6v2.25A2.25 2.25 0 0118 10.5h-2.25a2.25 2.25 0 01-2.25-2.25V6zM13.5 15.75a2.25 2.25 0 012.25-2.25H18a2.25 2.25 0 012.25 2.25V18A2.25 2.25 0 0118 20.25h-2.25A2.25 2.25 0 0113.5 18v-2.25z"/></svg>
      <span class="truncate max-w-full">Блоки</span>

    <button data-tab="downloads" class="mobile-nav-btn tap-scale flex flex-col items-center justify-center py-1 rounded-xl text-[10px] font-medium min-w-0">
      <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5M16.5 12L12 16.5m0 0L7.5 12m4.5 4.5V3"/></svg>

    <button data-tab="study" class="mobile-nav-btn tap-scale flex flex-col items-center justify-center py-1 rounded-xl text-[10px] font-medium min-w-0">
      <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5.25 5.653c0-.856.917-1.398 1.667-.986l11.54 6.348a1.125 1.125 0 010 1.971l-11.54 6.347a1.125 1.125 0 01-1.667-.985V5.653z"/></svg>
      <span class="truncate max-w-full">Учить</span>

    <button data-tab="errors" class="mobile-nav-btn tap-scale flex flex-col items-center justify-center py-1 rounded-xl text-[10px] font-medium min-w-0 relative">

        </button>
      </div>
      <div id="modalBody" class="p-5 overflow-y-auto custom-scroll space-y-4 text-sm"></div>
    </div>
  </div>
