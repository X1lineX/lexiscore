<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>LexisCore — Модульная платформа для обучения</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
          colors: {
            brand: {
              50: '#eef2ff',
              100: '#e0e7ff',
              400: '#818cf8',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca'
            }
          }
        }
      }
    };
  </script>
  <style>
    * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
    body { font-family: 'Inter', system-ui, sans-serif; overscroll-behavior-y: none; }
    .vowel-pill, .tap-scale {
      will-change: transform;
      transition: transform 0.14s cubic-bezier(0.22, 1, 0.36, 1), background-color 0.16s ease, border-color 0.16s ease;
    }
    .vowel-pill:active, .tap-scale:active { transform: scale(0.94); }
    .card-enter {
      will-change: transform, opacity;
      animation: cardSlideIn 0.24s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
    .pop-in {
      will-change: transform, opacity;
      animation: popIn 0.22s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }
    .shake-err {
      will-change: transform;
      animation: shakeErr 0.32s cubic-bezier(0.36, 0.07, 0.19, 0.97) forwards;
    }
    @keyframes cardSlideIn {
      from { opacity: 0; transform: translate3d(0, 10px, 0) scale(0.985); }
      to { opacity: 1; transform: translate3d(0, 0, 0) scale(1); }
    }
    @keyframes popIn {
      from { opacity: 0; transform: scale3d(0.94, 0.94, 1); }
      to { opacity: 1; transform: scale3d(1, 1, 1); }
    }
    @keyframes shakeErr {
      0%, 100% { transform: translate3d(0, 0, 0); }
      25% { transform: translate3d(-5px, 0, 0); }
      75% { transform: translate3d(5px, 0, 0); }
    }
    .safe-bottom {
      padding-bottom: calc(0.45rem + env(safe-area-inset-bottom, 0px));
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .custom-scroll::-webkit-scrollbar { width: 5px; height: 5px; }
    .custom-scroll::-webkit-scrollbar-track { background: transparent; }
    .custom-scroll::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.28); border-radius: 999px; }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 min-h-screen flex flex-col md:flex-row selection:bg-indigo-500/30">

    <button data-tab="downloads" class="mobile-nav-btn tap-scale flex flex-col items-center justify-center py-1 rounded-xl text-[10px] font-medium min-w-0">
      <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5M16.5 12L12 16.5m0 0L7.5 12m4.5 4.5V3"/></svg>

  <!-- Toast Container -->
  <div id="toastContainer" class="fixed top-4 right-4 z-50 flex flex-col gap-2 pointer-events-none"></div>

  <script>
  (() => {
    'use strict';

    // =========================================================================
    // 1. STORAGE & CORE STATE (Empty Shell by default)
    // =========================================================================
    const STORAGE_KEY = 'lexiscore_v2_state';
    const RU_VOWELS = new Set(['а','е','ё','и','о','у','ы','э','ю','я','А','Е','Ё','И','О','У','Ы','Э','Ю','Я']);

    function todayKey() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }

    const defaultSettings = () => ({
      shuffleOptions: true,
      autoNextOnCorrect: false,
      soundEffects: false,
      strictYo: false,
      autoBreakNumbered: true,
      indentParagraphs: true,
      fontScale: 100, // 85, 100, 115
      horizonSize: 15,
      errorReturnChance: 65,
      oldReviewChance: 20,
      errCooldownMin: 5,
      errCooldownMax: 14,
      errorDebtAdd: 2,
      errorDebtMax: 3,
      masteryStreak: 3
    });

    const defaultState = () => ({
      theme: 'dark',
      dailyGoal: 20,
      stepCounter: 0,
      dailyLog: { date: todayKey(), count: 0 },
      settings: defaultSettings(),
      customPrompt: null,
      modules: [],
      downloaded: [],
      customFolders: [],
      stats: {},
      activeModuleId: null,
      activeTab: 'modules'
    });

    let state = defaultState();

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY) || localStorage.getItem('lexiscore_v1_state');
        if (raw) {
          const parsed = JSON.parse(raw);
          state = { ...defaultState(), ...parsed, settings: { ...defaultSettings(), ...(parsed.settings || {}) } };
          if (!state.dailyLog || state.dailyLog.date !== todayKey()) {
            state.dailyLog = { date: todayKey(), count: 0 };
          }
        }
      } catch (e) {
        // Fallback to in-memory state if localStorage is blocked
      }
      applyTheme(state.theme);
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (e) {
        // Ignore storage quota errors in restricted environments
      }
      scheduleCloudSync();
    }

    // =========================================================================
    // 1.5 CLOUD SYNC ENGINE (Google Apps Script + Google Drive data/ & user/)
    // =========================================================================
    // Адрес облачного сервера синхронизации (Web App URL):
    const DEFAULT_CLOUD_URL = 'https://script.google.com/macros/s/AKfycbwYRlP9jV4YtVbbC_a3OIqECRz6f2t4aC1QwAbKYZka5vCBDXhI75CvIX2AsKIrVB3r/exec';
    const CLOUD_META_KEY = 'lexiscore_cloud_meta_v1';

    let cloudMeta = { url: DEFAULT_CLOUD_URL, login: '', passwordHash: '', lastSync: null };
    let cloudDataCache = null;
    let cloudDataLoading = false;
    let cloudDataError = '';
    let cloudSyncTimer = null;

    function loadCloudMeta() {
      try {
        const raw = localStorage.getItem(CLOUD_META_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          cloudMeta = {
            url: (parsed.url || DEFAULT_CLOUD_URL || '').trim(),
            login: parsed.login || '',
            passwordHash: parsed.passwordHash || '',
            lastSync: parsed.lastSync || null
          };
        }
      } catch (e) {}
      if (!cloudMeta.url && DEFAULT_CLOUD_URL) cloudMeta.url = DEFAULT_CLOUD_URL;
      updateCloudBadges();
    }

    function saveCloudMeta() {
      try {
        localStorage.setItem(CLOUD_META_KEY, JSON.stringify(cloudMeta));
      } catch (e) {}
      updateCloudBadges();
    }

    function updateCloudBadges() {
      const dLbl = document.getElementById('desktopCloudLabel');
      const mBtn = document.getElementById('openCloudModalMobile');
      if (dLbl) {
        dLbl.textContent = cloudMeta.login ? `☁️ @${cloudMeta.login}` : '☁️ Вход';
      }
      if (mBtn) {
        mBtn.textContent = cloudMeta.login ? `☁️ @${cloudMeta.login}` : '☁️ Вход';
      }
    }

    // Универсальный SHA-256 (работает и по HTTPS, и локально по file://)
    async function sha256Hex(str) {
      try {
        if (window.crypto && window.crypto.subtle) {
          const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
          return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
        }
      } catch (e) {}
      // Чистый JS-фолбэк (FNV-1a 128-bit style) для небезопасного контекста file://
      let h1 = 0x811c9dc5, h2 = 0x9e3779b9;
      for (let i = 0; i < str.length; i++) {
        const c = str.charCodeAt(i);
        h1 = Math.imul(h1 ^ c, 0x01000193);
        h2 = Math.imul(h2 ^ (c + i), 0x85ebca6b);
      }
      return (h1 >>> 0).toString(16).padStart(8, '0') + (h2 >>> 0).toString(16).padStart(8, '0');
    }

    async function cloudGet(action, params = {}) {
      const base = (cloudMeta.url || '').trim();
      if (!base) throw new Error('Не указан URL Google Apps Script');
      const url = new URL(base);
      url.searchParams.set('action', action);
      Object.entries(params).forEach(([k, v]) => url.searchParams.set(k, v));
      const res = await fetch(url.toString(), { method: 'GET' });
      const data = await res.json();
      if (!data.ok) throw new Error(data.error || 'Ошибка сервера');
      return data;
    }

    async function cloudPost(payload) {
      const base = (cloudMeta.url || '').trim();
      if (!base) throw new Error('Не указан URL Google Apps Script');
      // text/plain — CORS simple request (без preflight OPTIONS для Google Apps Script)
      const res = await fetch(base, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      });
      const data = await res.json();
      if (!data.ok) throw new Error(data.error || 'Ошибка сервера');
      return data;
    }

    function scheduleCloudSync() {
      if (!cloudMeta.url || !cloudMeta.login || !cloudMeta.passwordHash) return;
      clearTimeout(cloudSyncTimer);
      cloudSyncTimer = setTimeout(() => {
        pushProgressToCloud(true);
      }, 3500);
    }

    async function pushProgressToCloud(silent = false) {
      if (!cloudMeta.url || !cloudMeta.login || !cloudMeta.passwordHash) return false;
      try {
        const res = await cloudPost({
          action: 'saveProgress',
          login: cloudMeta.login,
          passwordHash: cloudMeta.passwordHash,
          state: state
        });
        cloudMeta.lastSync = res.updatedAt || Date.now();
        saveCloudMeta();
        if (!silent) showToast('Прогресс сохранён на Google Диск!', 'success');
        return true;
      } catch (err) {
        if (!silent) showToast(`Ошибка синхронизации: ${err.message}`, 'error');
        return false;
      }
    }

    async function refreshCloudDataList(force = false) {
      if (!cloudMeta.url) return;
      if (cloudDataLoading) return;
      if (cloudDataCache && !force) return;
      cloudDataLoading = true;
      cloudDataError = '';
      try {
        const res = await cloudGet('listData');
        cloudDataCache = res.files || [];
      } catch (err) {
        cloudDataError = err.message || 'Не удалось загрузить список файлов с Диска';
      } finally {
        cloudDataLoading = false;
        if (state.activeTab === 'downloads') {
          renderDownloadsView(document.getElementById('viewContainer'));
        }
      }
    }

    async function downloadFromCloudData(fileEntry, silent = false) {
      const res = await cloudGet('fetchFile', { fileId: fileEntry.id });
      let added = 0;
      if (res.ext === 'zip' && res.base64) {
        if (typeof JSZip === 'undefined') throw new Error('Библиотека JSZip не загружена');
        const zip = await JSZip.loadAsync(res.base64, { base64: true });
        const zipBase = res.name.replace(/\.zip$/i, '');
        const entries = Object.values(zip.files).filter(f =>
          !f.dir && f.name.toLowerCase().endsWith('.json') && !f.name.includes('__MACOSX')
        );
        for (const entry of entries) {
          try {
            const text = await entry.async('string');
            const parsed = JSON.parse(text);
            const parts = entry.name.split('/').filter(Boolean);
            const subFolder = parts.length > 1 ? parts.slice(0, -1).join(' / ') : zipBase;
            const fullFolder = fileEntry.folder && fileEntry.folder !== 'Общая папка'
              ? `${fileEntry.folder} / ${subFolder}`
              : subFolder;
            addToDownloaded(parsed, fullFolder);
            added++;
          } catch (e) {}
        }
      } else if (res.text) {
        const parsed = JSON.parse(res.text);
        addToDownloaded(parsed, fileEntry.folder || parsed.category || 'Общая папка');
        added++;
      }
      if (added > 0) {
        saveState();
        updateBadges();
        if (!silent) showToast(`Загружено в «Скачанное»: ${added} блок(ов)`, 'success');
      }
      return added;
    }

    function openCloudAccountModal() {
      const hasUrl = Boolean((cloudMeta.url || '').trim());
      const renderModalBody = () => {
        if (!hasUrl && !cloudMeta.url) {
          openModal('☁️ Облако (Google Диск)', `
            <div class="space-y-3">
              <p class="text-xs sm:text-sm text-slate-600 dark:text-slate-300">Чтобы хранить прогресс в папке <code class="px-1 py-0.5 rounded bg-slate-100 dark:bg-slate-800">user/</code> и подгружать файлы из <code class="px-1 py-0.5 rounded bg-slate-100 dark:bg-slate-800">data/</code>, вставь URL развёрнутого <b>Google Apps Script</b> (или перейди в «Настройки»).</p>
              <input id="modalCloudUrlInp" type="url" value="${escapeHtml(cloudMeta.url)}" placeholder="https://script.google.com/macros/s/.../exec" class="w-full px-3.5 py-2 rounded-xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-xs font-mono" />
              <div class="flex justify-end gap-2">
                <button id="saveCloudUrlModalBtn" class="px-4 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold">Сохранить URL и продолжить</button>
              </div>
            </div>
          `);
          document.getElementById('saveCloudUrlModalBtn').addEventListener('click', () => {
            const val = document.getElementById('modalCloudUrlInp').value.trim();
            if (!val) { showToast('Вставь ссылку на Web App', 'warn'); return; }
            cloudMeta.url = val;
            saveCloudMeta();
            cloudDataCache = null;
            openCloudAccountModal();
          });
          return;
        }

        if (cloudMeta.login) {
          const syncStr = cloudMeta.lastSync ? new Date(cloudMeta.lastSync).toLocaleString('ru-RU') : 'ещё не синхронизировано';
          openModal(`☁️ Аккаунт: @${cloudMeta.login}`, `
            <div class="space-y-4">
              <div class="p-3.5 rounded-xl bg-emerald-500/10 border border-emerald-500/20 text-xs space-y-1">
                <div class="font-bold text-emerald-500">Подключено к Google Диску</div>
                <div class="text-slate-500 dark:text-slate-400">Последняя синхронизация: <b>${escapeHtml(syncStr)}</b></div>
              </div>
              <div class="flex flex-wrap gap-2">
                <button id="cloudPushNowBtn" class="flex-1 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold">☁️ Сохранить прогресс сейчас</button>
                <button id="cloudPullNowBtn" class="flex-1 py-2.5 rounded-xl border border-slate-300 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800 text-xs font-semibold">⬇️ Загрузить с Диска</button>
              </div>
              <div class="flex items-center justify-between pt-2 border-t border-slate-200 dark:border-slate-800">
                <button id="cloudLogoutBtn" class="text-xs text-rose-500 font-semibold hover:underline">Выйти из аккаунта</button>
                <button id="cloudChangeUrlBtn" class="text-xs text-slate-400 hover:text-slate-600">Изменить URL скрипта</button>
              </div>
            </div>
          `);
          document.getElementById('cloudPushNowBtn').addEventListener('click', async () => {
            await pushProgressToCloud(false);
            openCloudAccountModal();
          });
          document.getElementById('cloudPullNowBtn').addEventListener('click', async () => {
            try {
              const res = await cloudPost({ action: 'login', login: cloudMeta.login, passwordHash: cloudMeta.passwordHash });
              if (res.state) {
                state = { ...defaultState(), ...res.state, settings: { ...defaultSettings(), ...(res.state.settings || {}) } };
                saveState();
                applyTheme(state.theme);
                cloudMeta.lastSync = res.updatedAt || Date.now();
                saveCloudMeta();
                closeModal();
                render();
                showToast('Прогресс загружен с Google Диска!', 'success');
              } else {
                showToast('На Диске пока нет сохранённого прогресса', 'info');
              }
            } catch (err) {
              showToast(err.message, 'error');
            }
          });
          document.getElementById('cloudLogoutBtn').addEventListener('click', () => {
            cloudMeta.login = '';
            cloudMeta.passwordHash = '';
            cloudMeta.lastSync = null;
            saveCloudMeta();
            closeModal();
            showToast('Вы вышли из облачного аккаунта', 'info');
          });
          document.getElementById('cloudChangeUrlBtn').addEventListener('click', () => {
            cloudMeta.url = '';
            saveCloudMeta();
            openCloudAccountModal();
          });
          return;
        }

        openModal('☁️ Вход и регистрация', `
          <div class="space-y-4">
            <p class="text-xs text-slate-500">Войдите или создайте аккаунт — прогресс и выбранные блоки будут сохраняться в облаке и останутся доступными с любого устройства.</p>
            <div class="space-y-2.5">
              <div>
                <label class="text-xs font-semibold text-slate-500 block mb-1">Логин (3–24 символа)</label>
                <input id="authLoginInp" type="text" placeholder="Например: alex_11a" class="w-full px-3.5 py-2 rounded-xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-sm" />
              </div>
              <div>
                <label class="text-xs font-semibold text-slate-500 block mb-1">Пароль</label>
                <input id="authPassInp" type="password" placeholder="••••••" class="w-full px-3.5 py-2 rounded-xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-sm" />
              </div>
            </div>
            <div id="authStatusMsg" class="text-xs text-rose-500 hidden"></div>
            <div class="flex gap-2">
              <button id="authLoginBtn" class="flex-1 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-xs sm:text-sm font-semibold">Войти</button>
              <button id="authRegisterBtn" class="flex-1 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white text-xs sm:text-sm font-semibold">Создать аккаунт</button>
            </div>
          </div>
        `);

        const showErr = (msg) => {
          const el = document.getElementById('authStatusMsg');
          el.textContent = msg;
          el.classList.remove('hidden');
        };

        document.getElementById('authLoginBtn').addEventListener('click', async () => {
          const login = document.getElementById('authLoginInp').value.trim();
          const pass = document.getElementById('authPassInp').value;
          if (!login || !pass) { showErr('Введи логин и пароль'); return; }
          try {
            const hash = await sha256Hex(pass);
            const res = await cloudPost({ action: 'login', login, passwordHash: hash });
            cloudMeta.login = res.login;
            cloudMeta.passwordHash = hash;
            cloudMeta.lastSync = res.updatedAt || Date.now();
            saveCloudMeta();
            if (res.state) {
              state = { ...defaultState(), ...res.state, settings: { ...defaultSettings(), ...(res.state.settings || {}) } };
              saveState();
              applyTheme(state.theme);
            }
            closeModal();
            render();
            showToast(res.passwordReset ? `Пароль обновлён для @${res.login}, прогресс восстановлен!` : `Добро пожаловать, @${res.login}!`, 'success');
          } catch (err) {
            showErr(err.message);
          }
        });

        document.getElementById('authRegisterBtn').addEventListener('click', async () => {
          const login = document.getElementById('authLoginInp').value.trim();
          const pass = document.getElementById('authPassInp').value;
          if (login.length < 3 || pass.length < 4) { showErr('Логин от 3 символов, пароль от 4 символов'); return; }
          try {
            const hash = await sha256Hex(pass);
            const res = await cloudPost({ action: 'register', login, passwordHash: hash, initialState: state });
            cloudMeta.login = res.login;
            cloudMeta.passwordHash = hash;
            cloudMeta.lastSync = res.updatedAt || Date.now();
            saveCloudMeta();
            if (res.passwordReset && res.state) {
              state = { ...defaultState(), ...res.state, settings: { ...defaultSettings(), ...(res.state.settings || {}) } };
              saveState();
              applyTheme(state.theme);
            }
            closeModal();
            render();
            showToast(res.passwordReset ? `Пароль обновлён для @${res.login}, прогресс восстановлен!` : `Аккаунт @${res.login} создан в облаке!`, 'success');
          } catch (err) {
            showErr(err.message);
          }
        });
      };
      renderModalBody();
    }

    function applyTheme(theme) {
      state.theme = theme;
      document.documentElement.classList.toggle('dark', theme === 'dark');
    }


    function getCfg() {
      if (!state.settings) state.settings = defaultSettings();
      return state.settings;
    }

    let audioCtx = null;
    function playTone(isCorrect) {
      if (!getCfg().soundEffects) return;
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        const now = audioCtx.currentTime;
        if (isCorrect) {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(523.25, now);
          osc.frequency.setValueAtTime(659.25, now + 0.07);
          gain.gain.setValueAtTime(0.08, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
          osc.start(now);
          osc.stop(now + 0.22);
        } else {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(220, now);
          osc.frequency.setValueAtTime(175, now + 0.1);
          gain.gain.setValueAtTime(0.1, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.26);
          osc.start(now);
          osc.stop(now + 0.26);
        }
      } catch (e) {}
    }

    function shuffleArray(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    // Dynamic font sizing based on character length so long tasks look great
    function adaptiveFontClass(text) {
      const len = String(text || '').length;
      if (len <= 25) return 'text-2xl sm:text-3xl font-extrabold text-center';
      if (len <= 75) return 'text-xl sm:text-2xl font-bold text-center leading-snug';
      if (len <= 180) return 'text-base sm:text-lg font-semibold text-left leading-relaxed';
      if (len <= 380) return 'text-sm sm:text-base font-medium text-left leading-relaxed';
      return 'text-xs sm:text-sm font-normal text-left leading-relaxed';
    }

    // Formats multi-line task text with red lines (paragraph indent) and auto-breaks for numbered sentences
    function formatRichTaskText(rawText) {
      const cfg = getCfg();
      let t = String(rawText || '').replace(/\\n/g, '\n').replace(/\\t/g, '\t');

      // If autoBreakNumbered is enabled and text is long with multiple numbered sentences "(1) ... (2) ..." or "1) ... 2) ..."
      if (cfg.autoBreakNumbered && t.length > 65) {
        // Break before "1) ", "2) " when preceded by space/punctuation
        t = t.replace(/([.!?:;])\s+(?=\d+\)\s)/g, '$1\n');
        // Break before "(2) [А-ЯЁ]" if "(1) [А-ЯЁ]" is used as sentence numbering (not inline comma markers like "дождь (1) начавшийся")
        if (/\(1\)\s*[А-ЯЁA-Z]/.test(t) && /\(2\)\s*[А-ЯЁA-Z]/.test(t)) {
          t = t.replace(/([.!?…])\s+(?=\(\d+\)\s*[А-ЯЁA-Z])/g, '$1\n\t');
        }
      }

      const lines = t.split(/\n+/);
      const isMulti = lines.length > 1 || t.length > 85;
      return lines.map(line => {
        let hasExplicitIndent = false;
        let clean = line;
        if (clean.startsWith('\t') || clean.startsWith('[indent]') || clean.startsWith('    ')) {
          hasExplicitIndent = true;
          clean = clean.replace(/^(\t|\[indent\]|    )+/, '');
        }
        const useIndent = hasExplicitIndent || (cfg.indentParagraphs && isMulti && clean.length > 45);
        return `<p class="${useIndent ? 'indent-6' : ''} mb-1.5 last:mb-0">${escapeHtml(clean)}</p>`;
      }).join('');
    }

    // =========================================================================
    // 2. TOASTS & MODALS (No alert/confirm/prompt)
    // =========================================================================
    function showToast(msg, type = 'info') {
      const el = document.createElement('div');
      const colors = {
        info: 'bg-slate-900 text-white dark:bg-slate-800 border-slate-700',
        success: 'bg-emerald-600 text-white border-emerald-500',
        error: 'bg-rose-600 text-white border-rose-500',
        warn: 'bg-amber-500 text-slate-950 border-amber-400'
      };
      el.className = `pointer-events-auto px-4 py-2.5 rounded-xl border shadow-lg text-sm font-medium transition-all duration-200 ${colors[type] || colors.info}`;
      el.textContent = msg;
      document.getElementById('toastContainer').appendChild(el);
      setTimeout(() => {
        el.style.opacity = '0';
        el.style.transform = 'translateY(-6px)';
        setTimeout(() => el.remove(), 220);
      }, 2600);
    }

    function openModal(title, html) {
      document.getElementById('modalTitle').textContent = title;
      document.getElementById('modalBody').innerHTML = html;
      document.getElementById('modalOverlay').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('modalOverlay').classList.add('hidden');
    }

    // =========================================================================
    // 3. SMART ERROR & GRADUAL EXPANSION ENGINE (For 1000+ word packs)
    // =========================================================================
    const MASTERY_STREAK = 3; // 3 correct answers in a row -> word graduates to "Mastered" (spaced review)

    function getItemStat(moduleId, itemId) {
      if (!state.stats[moduleId]) state.stats[moduleId] = {};
      if (!state.stats[moduleId][itemId]) {
        state.stats[moduleId][itemId] = {
          attempts: 0,
          totalErrors: 0,
          activeError: 0, // Error debt: must answer correctly N times to resolve!
          streak: 0,
          favorite: false,
          lastWrong: null,
          nextReview: 0,
          inWork: false // True once introduced into the active working set
        };
      }
      const st = state.stats[moduleId][itemId];
      // Migrate v1 stats cleanly
      if (st.totalErrors === undefined) st.totalErrors = st.errors || 0;
      if (st.activeError === undefined) st.activeError = st.errors > 0 ? Math.min(st.errors, 2) : 0;
      if (st.inWork === undefined) st.inWork = st.attempts > 0;
      return st;
    }

    function randInt(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function recordAnswer(moduleId, itemId, isCorrect, wrongLabel = null) {
      const st = getItemStat(moduleId, itemId);
      st.attempts += 1;
      state.stepCounter = (state.stepCounter || 0) + 1;
      const step = state.stepCounter;
      const now = Date.now();

      const cfg = getCfg();
      playTone(isCorrect);
      if (isCorrect) {
        st.streak += 1;
        session.sessionStreak += 1;

        if (st.activeError > 0) {
          st.activeError -= 1;
          if (st.activeError === 0) {
            showToast('✓ Ошибка отработана и закрыта!', 'success');
          }
        }

        const cooldown = st.streak === 1 ? randInt(5, 9)
          : st.streak === 2 ? randInt(12, 20)
          : randInt(25, 45);
        st.dueAtStep = step + cooldown;

        const mins = [1, 10, 120, 1440, 4320, 10080][Math.min(st.streak - 1, 5)];
        st.nextReview = now + mins * 60000;
      } else {
        st.totalErrors += 1;
        st.activeError = Math.min((st.activeError || 0) + (cfg.errorDebtAdd || 2), cfg.errorDebtMax || 3);
        st.streak = 0;
        session.sessionStreak = 0;
        st.lastWrong = wrongLabel || 'Ошибка';

        const cMin = Math.min(cfg.errCooldownMin || 5, cfg.errCooldownMax || 14);
        const cMax = Math.max(cfg.errCooldownMin || 5, cfg.errCooldownMax || 14);
        st.dueAtStep = step + randInt(cMin, cMax);
        st.nextReview = now;
      }

      if (state.dailyLog.date !== todayKey()) {
        state.dailyLog = { date: todayKey(), count: 0 };
      }
      state.dailyLog.count += 1;
      saveState();
      updateBadges();
    }

    function toggleFavorite(moduleId, itemId) {
      const st = getItemStat(moduleId, itemId);
      st.favorite = !st.favorite;
      saveState();
      updateBadges();
      return st.favorite;
    }

    function pickSmartItem(allEligible, scope, lastItemId = null) {
      if (!allEligible.length) return { picked: null, isReviewInjection: false };
      const step = state.stepCounter || 0;

      if (scope === 'errors') {
        const errPool = allEligible.filter(e => getItemStat(e.moduleId, e.item.id).activeError > 0);
        if (!errPool.length) return { picked: null, isReviewInjection: false };
        // Prefer errors whose cooldown has passed, fallback to any active error
        const ready = errPool.filter(e => (getItemStat(e.moduleId, e.item.id).dueAtStep || 0) <= step);
        const pool = ready.length ? ready : errPool;
        const picked = weightedRandomPick(pool, lastItemId, e => {
          const st = getItemStat(e.moduleId, e.item.id);
          return 1 + st.activeError * 2 + (st.favorite ? 1 : 0);
        });
        return { picked, isReviewInjection: false };
      }

      if (scope === 'favorites') {
        const favPool = allEligible.filter(e => getItemStat(e.moduleId, e.item.id).favorite);
        if (!favPool.length) return { picked: null, isReviewInjection: false };
        const ready = favPool.filter(e => (getItemStat(e.moduleId, e.item.id).dueAtStep || 0) <= step);
        const pool = ready.length ? ready : favPool;
        const picked = weightedRandomPick(pool, lastItemId, e => {
          const st = getItemStat(e.moduleId, e.item.id);
          return 1 + st.activeError * 2;
        });
        return { picked, isReviewInjection: false };
      }

      if (scope === 'new') {
        const newPool = allEligible.filter(e => getItemStat(e.moduleId, e.item.id).attempts === 0);
        if (!newPool.length) return { picked: null, isReviewInjection: false };
        const chunk = newPool.slice(0, 20);
        const picked = weightedRandomPick(chunk, lastItemId, () => 1);
        return { picked, isReviewInjection: false };
      }

      // SMART MODE ('all'):
      // 1. Due error words (cooldown 5-14 steps already elapsed -> feels natural, not repetitive!)
      // 2. Sliding active horizon of unseen/learning words (so 3000+ word JSONs expand smoothly)
      // 3. Occasional return to old mastered words (~15% chance or when due)
      const dueErrors = [];
      const learningReady = [];
      const unseen = [];
      const masteredReady = [];
      const masteredAll = [];

      const cfg = getCfg();
      const targetMastery = cfg.masteryStreak || MASTERY_STREAK;
      for (const entry of allEligible) {
        const st = getItemStat(entry.moduleId, entry.item.id);
        const isReady = (st.dueAtStep || 0) <= step;

        if (st.activeError > 0 && isReady) {
          dueErrors.push(entry);
        } else if (st.attempts === 0) {
          unseen.push(entry);
        } else if (st.streak < targetMastery) {
          if (isReady) learningReady.push(entry);
        } else {
          masteredAll.push(entry);
          if (isReady) masteredReady.push(entry);
        }
      }

      const errProb = (cfg.errorReturnChance ?? 65) / 100;
      if (dueErrors.length && Math.random() < errProb) {
        const picked = weightedRandomPick(dueErrors, lastItemId, e => {
          const st = getItemStat(e.moduleId, e.item.id);
          return 1 + st.activeError * 2;
        });
        return { picked, isReviewInjection: false };
      }

      const oldProb = (cfg.oldReviewChance ?? 20) / 100;
      if (masteredAll.length && (masteredReady.length > 0 && Math.random() < oldProb || Math.random() < oldProb * 0.5)) {
        const revPool = masteredReady.length ? masteredReady : masteredAll;
        const picked = weightedRandomPick(revPool, lastItemId, () => 1);
        return { picked, isReviewInjection: true };
      }

      const hSize = cfg.horizonSize || 15;
      const horizon = [...learningReady, ...unseen.slice(0, hSize)];
      if (horizon.length) {
        const picked = weightedRandomPick(horizon, lastItemId, e => {
          const st = getItemStat(e.moduleId, e.item.id);
          return st.attempts === 0 ? 1.4 : (1.8 + st.activeError);
        });
        return { picked, isReviewInjection: false };
      }

      // Fallback if all words are on cooldown (e.g. very small deck)
      const picked = weightedRandomPick(allEligible, lastItemId, e => {
        const st = getItemStat(e.moduleId, e.item.id);
        return 1 + st.activeError * 2;
      });
      return { picked, isReviewInjection: false };
    }

    function weightedRandomPick(pool, lastItemId, weightFn) {
      if (!pool.length) return null;
      const filtered = pool.length > 1 && lastItemId ? pool.filter(x => x.item.id !== lastItemId) : pool;
      const weights = filtered.map(x => Math.max(weightFn(x), 0.2));
      const total = weights.reduce((a, b) => a + b, 0);
      let r = Math.random() * total;
      for (let i = 0; i < filtered.length; i++) {
        r -= weights[i];
        if (r <= 0) return filtered[i];
      }
      return filtered[filtered.length - 1];
    }

    // =========================================================================
    // 4. PLUGGABLE MODE REGISTRY (Конструктность режимов)
    // =========================================================================
    const ModeRegistry = {
      modes: {},
      register(id, def) {
        this.modes[id] = { id, ...def };
      },
      get(id) {
        return this.modes[id];
      },
      listForModule(mod) {
        const supported = mod && Array.isArray(mod.supportedModes) && mod.supportedModes.length
          ? mod.supportedModes
          : ['flashcard', 'quiz'];
        return supported.map(id => this.modes[id]).filter(Boolean);
      }
    };

    function generateStressDistractors(item) {
      const word = item.front.toLowerCase();
      const vowelIndices = [];
      for (let i = 0; i < word.length; i++) {
        if (RU_VOWELS.has(word[i])) vowelIndices.push(i);
      }
      const variants = [item.back];
      for (const idx of vowelIndices) {
        if (idx === item.stressIndex) continue;
        const v = word.slice(0, idx) + word[idx].toUpperCase() + word.slice(idx + 1);
        if (!variants.includes(v)) variants.push(v);
      }
      return variants.slice(0, 4).sort(() => Math.random() - 0.5);
    }

    // MODE 1: STRESS TAP (Ударения)
    ModeRegistry.register('stress', {
      name: 'Ударения',

      supportsItem: (item) => typeof item.stressIndex === 'number' && item.stressIndex >= 0,
      render(container, ctx) {
        const { item, moduleId, onComplete } = ctx;
        const chars = Array.from(item.front.toLowerCase());

        container.innerHTML = `
          <div class="text-center space-y-6">
            <div class="text-xs uppercase tracking-wider font-semibold text-indigo-500 dark:text-indigo-400">

            </div>
            <div id="stressWordRow" class="flex flex-wrap items-center justify-center gap-1.5 sm:gap-2 py-4">
              ${chars.map((ch, idx) => {
                const isVowel = RU_VOWELS.has(ch);
                if (!isVowel) {
                  return `<span class="text-3xl sm:text-4xl font-bold text-slate-500 dark:text-slate-400 px-0.5 select-none">${escapeHtml(ch)}</span>`;
                }
                const vNum = vowelMap.indexOf(idx) + 1;
                return `
                  <button data-char-idx="${idx}" class="vowel-pill relative group px-3 sm:px-3.5 py-2 rounded-xl border-2 border-indigo-500/30 bg-indigo-500/10 hover:bg-indigo-500/20 hover:border-indigo-500 text-3xl sm:text-4xl font-extrabold text-slate-900 dark:text-white cursor-pointer">
                    ${escapeHtml(ch)}
                    <span class="hidden sm:block absolute -top-2 -right-1.5 text-[10px] font-semibold px-1.5 py-0.2 rounded-full bg-slate-200 dark:bg-slate-800 text-slate-500 dark:text-slate-400">${vNum}</span>
                  </button>
                `;
              }).join('')}
            </div>
            <div id="stressFeedback" class="hidden rounded-2xl p-4 text-left border"></div>
          </div>
        `;

        const handlePick = (idx) => {
          if (answered) return;
          answered = true;
          const isCorrect = idx === item.stressIndex;
          const wrongDisplay = chars.map((c, i) => i === idx ? c.toUpperCase() : c).join('');
          recordAnswer(moduleId, item.id, isCorrect, isCorrect ? null : wrongDisplay);

          container.querySelectorAll('[data-char-idx]').forEach(btn => {
            const bIdx = Number(btn.dataset.charIdx);
            btn.disabled = true;
            btn.classList.remove('border-indigo-500/30', 'bg-indigo-500/10', 'hover:bg-indigo-500/20');
            if (bIdx === item.stressIndex) {
              btn.classList.add('border-emerald-500', 'bg-emerald-500/20', 'text-emerald-600', 'dark:text-emerald-300', 'scale-110');
              btn.firstChild.textContent = chars[bIdx].toUpperCase();
            } else if (bIdx === idx && !isCorrect) {
              btn.classList.add('border-rose-500', 'bg-rose-500/20', 'text-rose-500');
            } else {
              btn.classList.add('border-transparent', 'opacity-45');
            }
          });

          const fb = container.querySelector('#stressFeedback');
          fb.classList.remove('hidden');
          fb.className = `${isCorrect ? 'pop-in' : 'shake-err'} rounded-2xl p-4 text-left border ${isCorrect
            ? 'bg-emerald-500/10 border-emerald-500/30 text-emerald-900 dark:text-emerald-100'
            : 'bg-rose-500/10 border-rose-500/30 text-rose-900 dark:text-rose-100'}`;
          fb.innerHTML = `
            <div class="flex items-center justify-between gap-2 mb-1">
              <span class="font-bold text-base">${isCorrect ? '✓ Верно!' : `✗ Ошибка — правильно: ${escapeHtml(item.back)}`}</span>
              <button id="nextCardBtn" class="px-4 py-1.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold transition">Дальше →</button>
            </div>
            ${item.explanation ? `<p class="text-xs sm:text-sm opacity-90 leading-relaxed mt-1">${escapeHtml(item.explanation)}</p>` : ''}
          `;
          fb.querySelector('#nextCardBtn').addEventListener('click', onComplete);
        };

        container.querySelectorAll('[data-char-idx]').forEach(btn => {
          btn.addEventListener('click', () => handlePick(Number(btn.dataset.charIdx)));
        });

        return (key) => {
          if (!answered && /^[1-9]$/.test(key)) {
            const vIdx = vowelMap[Number(key) - 1];
            if (vIdx !== undefined) handlePick(vIdx);
          } else if (answered && (key === ' ' || key === 'Enter')) {
            onComplete();
          }
        };
      }
    });

    // MODE 2: FLASHCARDS (Карточки)
    ModeRegistry.register('flashcard', {
      name: 'Карточки',
      icon: '🗂️',
      supportsItem: () => true,
      render(container, ctx) {
        const { item, moduleId, onComplete } = ctx;
        let flipped = false;

        container.innerHTML = `
          <div class="space-y-5">
            <div id="flashcardBox" class="cursor-pointer select-none rounded-2xl border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-800/50 p-6 sm:p-8 text-center min-h-[200px] flex flex-col items-center justify-center transition hover:border-indigo-500/40">
              <div class="text-xs uppercase tracking-wider font-semibold text-slate-400 mb-3">${escapeHtml(item.hint || 'Нажми, чтобы перевернуть')}</div>
              <div class="${adaptiveFontClass(item.front)} w-full">${formatRichTaskText(item.front)}</div>
              <div id="flashcardBack" class="hidden mt-5 pt-5 border-t border-slate-200 dark:border-slate-700 w-full space-y-2">

                ${item.explanation ? `<p class="text-xs sm:text-sm text-slate-600 dark:text-slate-300 max-w-lg mx-auto">${escapeHtml(item.explanation)}</p>` : ''}

              <button id="fcRightBtn" class="py-3 rounded-xl bg-emerald-500/15 hover:bg-emerald-500/25 text-emerald-600 dark:text-emerald-400 font-semibold text-sm transition">✓ Знаю</button>
            </div>
            <div id="flashcardFlipHint" class="text-center">
              <button id="fcFlipBtn" class="px-6 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-semibold transition">Показать ответ (Space)</button>

        container.querySelector('#fcFlipBtn').addEventListener('click', flip);
        container.querySelector('#fcWrongBtn').addEventListener('click', () => {

          onComplete();
        });
        container.querySelector('#fcRightBtn').addEventListener('click', () => {
          recordAnswer(moduleId, item.id, true);
          onComplete();
        });

        return (key) => {
          if (!flipped && (key === ' ' || key === 'Enter')) flip();
          else if (flipped && key === '1') { recordAnswer(moduleId, item.id, false, 'Не вспомнил'); onComplete(); }
          else if (flipped && (key === '2' || key === 'Enter')) { recordAnswer(moduleId, item.id, true); onComplete(); }
        };
      }
    });

    // MODE 3: QUIZ (Тест 4 варианта)
    ModeRegistry.register('quiz', {
      name: 'Тест',
      icon: '⚡',
      supportsItem: () => true,
      render(container, ctx) {
        const { item, moduleId, moduleItems, onComplete } = ctx;
        let options = Array.isArray(item.options) && item.options.length >= 2 ? [...item.options] : null;
        if (!options && typeof item.stressIndex === 'number') {
          options = generateStressDistractors(item);
        }
        if (!options) {
          const others = moduleItems.filter(x => x.id !== item.id).map(x => x.back).sort(() => Math.random() - 0.5).slice(0, 3);
          options = [item.back, ...others];

        if (getCfg().shuffleOptions) {

              <div class="${adaptiveFontClass(item.front)}">${formatRichTaskText(item.front)}</div>

                  <span class="w-6 h-6 rounded-lg bg-slate-200 dark:bg-slate-700 text-xs flex items-center justify-center font-bold shrink-0">${idx + 1}</span>

            if (options[idx] !== undefined) pick(idx);
          } else if (answered && (key === ' ' || key === 'Enter')) {
            onComplete();
          }
        };

    // MODE 4: TYPING (Ввод ответа)
    ModeRegistry.register('typing', {
      name: 'Ввод',
      icon: '⌨️',
      supportsItem: () => true,
      render(container, ctx) {
        const { item, moduleId, onComplete } = ctx;
        let answered = false;

        container.innerHTML = `
          <div class="space-y-5">
            <div class="space-y-2">
              <div class="text-center text-xs uppercase tracking-wider font-semibold text-indigo-500">${escapeHtml(item.hint || 'Введи правильный ответ')}</div>
              <div class="${adaptiveFontClass(item.front)}">${formatRichTaskText(item.front)}</div>

    // MODE 9: AUTO (Автоматически выбирает нужный режим под тип карточки)
    function inferItemMode(item) {
      if (item.type && ModeRegistry.get(item.type)) return item.type;
      if (typeof item.stressIndex === 'number' && item.stressIndex >= 0) return 'stress';
      if (Array.isArray(item.choices) && item.choices.length) return 'gap_choice';
      if (Array.isArray(item.correctIndices) && Array.isArray(item.options)) return 'multi_choice';
      if (/\.\.|___|\[\.\.\.\]/.test(item.front)) return 'gap_input';
      if (/\(\d+\)/.test(item.front) && /^\d+$/.test(String(item.back).trim())) return 'digits';
      if (Array.isArray(item.options) && item.options.length >= 2) return 'quiz';
      return 'flashcard';
    }

    ModeRegistry.register('auto', {
      name: 'По заданию',
      icon: '🧩',
      supportsItem: () => true,
      render(container, ctx) {
        const targetModeId = inferItemMode(ctx.item);
        const modeDef = ModeRegistry.get(targetModeId) || ModeRegistry.get('flashcard');
        return modeDef.render(container, ctx);
      }
    });

    // =========================================================================
    // 5. MODULE IMPORT, EXPORT & AI PROMPT
    // =========================================================================
    function normalizeModule(mod) {
      if (!mod || typeof mod !== 'object' || !mod.title || !Array.isArray(mod.items) || !mod.items.length) {
        throw new Error('Неверный формат JSON: нужны поля title и непустой массив items.');
      }
      const id = mod.id || `mod_${Date.now()}_${Math.floor(Math.random() * 1000)}`;
      return {
        id,
        title: String(mod.title),
        description: String(mod.description || ''),
        category: String(mod.category || 'Общее'),
        folder: String(mod.folder || mod.category || 'Общее').trim() || 'Общее',
        version: String(mod.version || '1.0'),
        supportedModes: Array.isArray(mod.supportedModes) && mod.supportedModes.length
          ? mod.supportedModes
          : (typeof mod.items[0].stressIndex === 'number'
              ? ['stress', 'flashcard', 'quiz']
              : ['auto', 'flashcard', 'quiz']),
        items: mod.items.map((it, idx) => {
          const front = String(it.front || '');
          const back = String(it.back || '');
          let stressIndex = typeof it.stressIndex === 'number' ? it.stressIndex : undefined;
          if (stressIndex !== undefined && back.length === front.length) {
            const upperIndices = Array.from(back).reduce((acc, ch, i) => {
              if (RU_VOWELS.has(ch) && ch === ch.toUpperCase() && ch !== ch.toLowerCase()) acc.push(i);
              return acc;
            }, []);
            if (upperIndices.length === 1) stressIndex = upperIndices[0];
          }
          return {
            id: String(it.id || `${id}_item_${idx + 1}`),
            type: it.type ? String(it.type) : undefined,
            front,
            back,
            stressIndex,
            choices: Array.isArray(it.choices) ? it.choices.map(String) : undefined,
            fullAnswer: it.fullAnswer ? String(it.fullAnswer) : undefined,
            correctIndices: Array.isArray(it.correctIndices) ? it.correctIndices.map(Number) : undefined,
            ordered: Boolean(it.ordered),
            hint: it.hint ? String(it.hint) : '',
            explanation: it.explanation ? String(it.explanation) : '',
            options: Array.isArray(it.options) ? it.options.map(String) : undefined
          };
        })
      };
    }

    function validateAndAddModule(mod, silent = false) {
      const normalized = normalizeModule(mod);
      const existingIdx = state.modules.findIndex(m => m.id === normalized.id);
      if (existingIdx >= 0) {
        if (!mod.folder && state.modules[existingIdx].folder) {
          normalized.folder = state.modules[existingIdx].folder;
        }
        state.modules[existingIdx] = normalized;
        if (!silent) showToast(`Блок «${normalized.title}» обновлён (${normalized.items.length} карт.)`, 'success');
      } else {
        state.modules.push(normalized);
        if (!silent) showToast(`Блок «${normalized.title}» добавлен (${normalized.items.length} карт.)`, 'success');
      }
      state.activeModuleId = normalized.id;
      saveState();
      updateBadges();
      if (!silent) render();
      return normalized;
    }

    function addToDownloaded(mod, folder = 'Общая папка') {
      const normalized = normalizeModule(mod);
      const cleanFolder = (folder || 'Общая папка').trim() || 'Общая папка';
      const idx = state.downloaded.findIndex(d => d.module.id === normalized.id);
      const entry = { id: normalized.id, folder: cleanFolder, module: normalized, addedAt: Date.now() };
      if (idx >= 0) state.downloaded[idx] = entry;
      else state.downloaded.push(entry);
      return entry;
    }

    function downloadJson(filename, dataObj) {
      const blob = new Blob([JSON.stringify(dataObj, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    }

    function renderDownloadsView(root) {

      const installedIds = new Set(state.modules.map(m => m.id));
      const folders = Array.from(new Set(state.downloaded.map(d => d.folder))).sort();

      const filtered = state.downloaded.filter(d => {
        if (dlFolderFilter !== '__ALL__' && d.folder !== dlFolderFilter) return false;
        const isInst = installedIds.has(d.module.id);
        if (dlStatusFilter === 'installed' && !isInst) return false;
        if (dlStatusFilter === 'available' && isInst) return false;
        if (dlQuery) {
          const q = dlQuery.toLowerCase();
          const t = d.module.title.toLowerCase();
          const desc = (d.module.description || '').toLowerCase();
          const cat = (d.module.category || '').toLowerCase();
          if (!t.includes(q) && !desc.includes(q) && !cat.includes(q)) return false;
        }
        return true;
      });

      root.innerHTML = `
        <div class="space-y-5 card-enter">
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
            <div>
              <h1 class="text-2xl font-extrabold tracking-tight">Скачанное</h1>
              <p class="text-sm text-slate-500 dark:text-slate-400">Импортируй .zip-архив или .json-файлы сюда, выбирай нужные блоки и добавляй через «+»</p>
            </div>
            <div class="flex flex-wrap gap-2">
              ${filtered.some(d => !installedIds.has(d.module.id)) ? `
                <button id="dlInstallAllBtn" class="px-4 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white text-xs sm:text-sm font-semibold shadow-md shadow-emerald-500/20 transition">⚡ Добавить всё (${filtered.filter(d => !installedIds.has(d.module.id)).length})</button>
              ` : ''}
              <button id="dlImportBtn" class="px-4 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-xs sm:text-sm font-semibold shadow-md shadow-indigo-500/20 transition">+ Загрузить .zip / .json</button>
            </div>
          </div>

          ${cloudMeta.url ? `
            <div class="rounded-2xl border border-sky-500/25 bg-sky-500/5 p-4 space-y-3">
              <div class="flex flex-wrap items-center justify-between gap-2">
                <div>
                  <div class="font-bold text-sm flex items-center gap-1.5 text-sky-600 dark:text-sky-400">☁️ Общая библиотека модулей</div>
                  <div class="text-xs text-slate-500">Готовые подборки и архивы автоматически загружаются с сервера</div>
                </div>
                <div class="flex gap-2">
                  <button id="refreshCloudDataBtn" class="px-3 py-1.5 rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-xs font-semibold hover:border-sky-500 transition">🔄 Обновить</button>
                  ${cloudDataCache && cloudDataCache.length ? `<button id="fetchAllCloudDataBtn" class="px-3 py-1.5 rounded-xl bg-sky-600 hover:bg-sky-500 text-white text-xs font-semibold transition">⬇️ Скачать все (${cloudDataCache.length})</button>` : ''}
                </div>
              </div>
              ${cloudDataLoading ? `<div class="text-xs text-slate-500">Загрузка списка файлов с Google Диска...</div>` : ''}
              ${cloudDataError ? `<div class="text-xs text-rose-500">Ошибка: ${escapeHtml(cloudDataError)}</div>` : ''}
              ${cloudDataCache && !cloudDataCache.length ? `<div class="text-xs text-slate-400">В папке data/ пока нет .json или .zip файлов.</div>` : ''}
              ${cloudDataCache && cloudDataCache.length ? `
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 max-h-60 overflow-y-auto custom-scroll pr-1">
                  ${cloudDataCache.map(cf => `
                    <div class="flex items-center justify-between gap-2 p-2.5 rounded-xl bg-white dark:bg-slate-900/80 border border-slate-200 dark:border-slate-800">
                      <div class="min-w-0">
                        <div class="text-xs font-bold truncate">${cf.ext === 'zip' ? '🗜️' : '📄'} ${escapeHtml(cf.name)}</div>
                        <div class="text-[11px] text-slate-400 truncate">📂 ${escapeHtml(cf.folder)} · ${Math.max(1, Math.round(cf.size / 1024))} КБ</div>
                      </div>
                      <button data-cloud-fetch="${escapeHtml(cf.id)}" class="shrink-0 px-2.5 py-1.5 rounded-lg bg-sky-500/15 hover:bg-sky-500/25 text-sky-600 dark:text-sky-400 text-xs font-semibold transition">⬇️ Скачать</button>
                    </div>
                  `).join('')}
                </div>
              ` : ''}
            </div>
          ` : ''}

          <!-- Search & Status Filter -->
          <div class="rounded-2xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900/70 p-4 space-y-3">
            <div class="flex flex-col sm:flex-row gap-2.5">
              <input id="dlSearchInput" type="text" value="${escapeHtml(dlQuery)}" placeholder="Поиск по названию или описанию блока..." class="flex-1 px-3.5 py-2 rounded-xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-sm" />
              <div class="flex gap-1 bg-slate-100 dark:bg-slate-800 p-1 rounded-xl self-start">
                ${[
                  { id: 'all', label: 'Все' },
                  { id: 'available', label: 'Не добавлены' },
                  { id: 'installed', label: 'Установлены' }
                ].map(st => `
                  <button data-dl-status="${st.id}" class="px-2.5 py-1 rounded-lg text-xs font-semibold transition ${dlStatusFilter === st.id ? 'bg-white dark:bg-slate-700 shadow text-indigo-600 dark:text-indigo-300' : 'text-slate-500'}">${st.label}</button>
                `).join('')}
              </div>
            </div>

            <!-- Folder Pills -->
            <div class="flex flex-wrap gap-1.5">
              <button data-dl-folder="__ALL__" class="px-3 py-1 rounded-full text-xs font-semibold transition ${dlFolderFilter === '__ALL__' ? 'bg-indigo-600 text-white' : 'bg-slate-100 dark:bg-slate-800 text-slate-500 hover:text-slate-800 dark:hover:text-slate-200'}">📁 Общая папка (${state.downloaded.length})</button>
              ${folders.map(f => {
                const cnt = state.downloaded.filter(d => d.folder === f).length;
                return `<button data-dl-folder="${escapeHtml(f)}" class="px-3 py-1 rounded-full text-xs font-semibold transition ${dlFolderFilter === f ? 'bg-indigo-600 text-white' : 'bg-slate-100 dark:bg-slate-800 text-slate-500 hover:text-slate-800 dark:hover:text-slate-200'}">📂 ${escapeHtml(f)} (${cnt})</button>`;
              }).join('')}
            </div>
          </div>

          ${!state.downloaded.length ? `
            <div id="dlDropZone" class="border-2 border-dashed border-slate-300 dark:border-slate-700 rounded-2xl p-10 text-center space-y-2 cursor-pointer hover:border-indigo-500 transition">
              <div class="text-4xl">🗜️</div>
              <div class="font-bold text-base">В «Скачанном» пока пусто</div>
              <p class="text-xs sm:text-sm text-slate-500 max-w-md mx-auto">Перетащи сюда целый <b>.zip архив</b> с папками и JSON-файлами или нажми, чтобы выбрать файлы. Они разложатся по папкам, а ты добавишь нужные в «Блоки» через «+».</p>
            </div>
          ` : !filtered.length ? `
            <div class="rounded-2xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900/60 p-10 text-center text-sm text-slate-500">
              По этому фильтру блоков не найдено.
            </div>
          ` : `
            <div class="grid grid-cols-1 md:grid-cols-2 gap-3.5">
              ${filtered.map(d => {
                const m = d.module;
                const isInst = installedIds.has(m.id);
                return `
                  <div class="rounded-2xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900/70 p-4 flex flex-col justify-between gap-3 hover:border-indigo-500/40 transition">
                    <div class="space-y-2">
                      <div class="flex items-center justify-between gap-2 flex-wrap">
                        <div class="flex items-center gap-1.5 flex-wrap">
                          <span class="text-[11px] font-semibold px-2 py-0.5 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-500">📂 ${escapeHtml(d.folder)}</span>
                          <span class="text-[11px] font-semibold px-2 py-0.5 rounded-full bg-indigo-500/10 text-indigo-500">${escapeHtml(m.category)}</span>
                        </div>
                        ${isInst
                          ? `<span class="text-[11px] font-semibold px-2 py-0.5 rounded-full bg-emerald-500/15 text-emerald-500">✓ Установлен</span>`
                          : `<span class="text-[11px] font-semibold px-2 py-0.5 rounded-full bg-slate-200/70 dark:bg-slate-800 text-slate-400">Не добавлен</span>`}
                      </div>
                      <h3 class="font-bold text-base leading-snug">${escapeHtml(m.title)}</h3>
                      <p class="text-xs text-slate-500 dark:text-slate-400">${escapeHtml(m.description || 'Описание отсутствует')}</p>
                    </div>

                    <div class="flex items-center justify-between gap-2 pt-2 border-t border-slate-100 dark:border-slate-800/80">
                      <span class="text-xs text-slate-400">Карточек: <b class="text-slate-700 dark:text-slate-200">${m.items.length}</b></span>
                      <div class="flex items-center gap-2">
                        <button data-dl-remove="${escapeHtml(m.id)}" title="Удалить из скачанного" class="px-2.5 py-1.5 rounded-xl bg-rose-500/10 hover:bg-rose-500/20 text-rose-500 text-xs font-semibold transition">🗑️</button>
                        ${isInst
                          ? `<button data-dl-uninstall="${escapeHtml(m.id)}" class="px-3 py-1.5 rounded-xl bg-slate-200 dark:bg-slate-800 hover:bg-slate-300 dark:hover:bg-slate-700 text-xs font-semibold transition">Убрать из блоков</button>`
                          : `<button data-dl-install="${escapeHtml(m.id)}" title="Добавить в блоки" class="px-3.5 py-1.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold transition shadow-sm">+ Добавить</button>`}
                      </div>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          `}
        </div>
      `;

      const refCloudBtn = root.querySelector('#refreshCloudDataBtn');
      if (refCloudBtn) refCloudBtn.addEventListener('click', () => refreshCloudDataList(true));
      const fetchAllCloudBtn = root.querySelector('#fetchAllCloudDataBtn');
      if (fetchAllCloudBtn) {
        fetchAllCloudBtn.addEventListener('click', async () => {
          if (!cloudDataCache || !cloudDataCache.length) return;
          fetchAllCloudBtn.disabled = true;
          fetchAllCloudBtn.textContent = 'Загрузка...';
          let total = 0;
          for (const cf of cloudDataCache) {
            try { total += await downloadFromCloudData(cf, true); } catch (e) {}
          }
          showToast(`Загружено с Диска: ${total} блок(ов)!`, 'success');
          renderDownloadsView(root);
        });
      }
      root.querySelectorAll('[data-cloud-fetch]').forEach(btn => btn.addEventListener('click', async () => {
        const cf = (cloudDataCache || []).find(x => x.id === btn.dataset.cloudFetch);
        if (!cf) return;
        btn.disabled = true;
        btn.textContent = '...';
        try {
          await downloadFromCloudData(cf, false);
          renderDownloadsView(root);
        } catch (err) {
          showToast(err.message, 'error');
          btn.disabled = false;
          btn.textContent = '⬇️ Скачать';
        }
      }));

      root.querySelector('#dlImportBtn').addEventListener('click', () => document.getElementById('jsonFileInput').click());
      const dz = root.querySelector('#dlDropZone');
      if (dz) {
        dz.addEventListener('click', () => document.getElementById('jsonFileInput').click());
        dz.addEventListener('dragover', (e) => { e.preventDefault(); dz.classList.add('border-indigo-500', 'bg-indigo-500/5'); });
        dz.addEventListener('dragleave', () => dz.classList.remove('border-indigo-500', 'bg-indigo-500/5'));
        dz.addEventListener('drop', (e) => {
          e.preventDefault();
          dz.classList.remove('border-indigo-500', 'bg-indigo-500/5');
          handleFileList(e.dataTransfer.files);
        });
      }

      const sInp = root.querySelector('#dlSearchInput');
      sInp.addEventListener('input', () => {
        dlQuery = sInp.value;
        renderDownloadsView(root);
        const f = root.querySelector('#dlSearchInput');
        f.focus();
        f.setSelectionRange(f.value.length, f.value.length);
      });

      root.querySelectorAll('[data-dl-status]').forEach(b => b.addEventListener('click', () => {
        dlStatusFilter = b.dataset.dlStatus;
        renderDownloadsView(root);
      }));
      root.querySelectorAll('[data-dl-folder]').forEach(b => b.addEventListener('click', () => {
        dlFolderFilter = b.dataset.dlFolder;
        renderDownloadsView(root);
      }));
      const installAllBtn = root.querySelector('#dlInstallAllBtn');
      if (installAllBtn) {
        installAllBtn.addEventListener('click', () => {
          const toAdd = filtered.filter(d => !installedIds.has(d.module.id));
          if (!toAdd.length) return;
          toAdd.forEach(d => {
            validateAndAddModule({ ...d.module, folder: d.folder }, true);
          });
          showToast(`Добавлено в «Блоки»: ${toAdd.length} блок(ов)!`, 'success');
          renderDownloadsView(root);
        });
      }

      root.querySelectorAll('[data-dl-install]').forEach(b => b.addEventListener('click', () => {
        const entry = state.downloaded.find(d => d.module.id === b.dataset.dlInstall);
        if (entry) {
          validateAndAddModule({ ...entry.module, folder: entry.folder }, true);
          showToast(`Блок «${entry.module.title}» добавлен в Блоки!`, 'success');
          renderDownloadsView(root);
        }
      }));
      root.querySelectorAll('[data-dl-uninstall]').forEach(b => b.addEventListener('click', () => {
        state.modules = state.modules.filter(m => m.id !== b.dataset.dlUninstall);
        saveState();
        updateBadges();
        showToast('Блок убран из активных (остался в Скачанном)', 'info');
        renderDownloadsView(root);
      }));
      root.querySelectorAll('[data-dl-remove]').forEach(b => b.addEventListener('click', () => {
        state.downloaded = state.downloaded.filter(d => d.module.id !== b.dataset.dlRemove);
        saveState();
        updateBadges();
        showToast('Удалено из Скачанного', 'info');
        renderDownloadsView(root);
      }));
    }

    // --- VIEW: STUDY ---
    function renderStudyView(root) {
      if (state.modules.length === 0) {
        root.innerHTML = `
          <div class="text-center py-16 space-y-4">
            <div class="text-4xl">📦</div>
            <h2 class="text-xl font-bold">Нет загруженных блоков</h2>
            <p class="text-sm text-slate-500">Сначала импортируй файл или создай блок во вкладке «Блоки».</p>
            <button id="backToMods" class="px-5 py-2.5 rounded-xl bg-indigo-600 text-white text-sm font-semibold">Перейти к блокам</button>
          </div>
        `;
        root.querySelector('#backToMods').addEventListener('click', () => { state.activeTab = 'modules'; render(); });
        return;
      }

      if (!session.moduleId && state.modules.length) {
        session.moduleId = state.modules[0].id;
      }
      const activeMod = (session.moduleId && session.moduleId.startsWith('__FOLDER__:'))
        ? (state.modules.find(m => getModuleFolder(m) === session.moduleId.slice('__FOLDER__:'.length)) || state.modules[0])
        : (state.modules.find(m => m.id === session.moduleId) || state.modules[0]);
      const availableModes = ModeRegistry.listForModule(activeMod);
      if (!availableModes.some(m => m.id === session.mode)) {
        session.mode = availableModes[0]?.id || 'flashcard';
      }

      const eligible = getEligibleItems();
      const { picked, isReviewInjection } = pickSmartItem(eligible, session.scope, session.currentItem?.item?.id);
      session.currentItem = picked;

      root.innerHTML = `
        <div class="max-w-2xl mx-auto space-y-4 card-enter">
          <!-- Mobile-First Controls Bar -->
          <div class="bg-white dark:bg-slate-900/80 border border-slate-200 dark:border-slate-800 rounded-2xl p-2.5 sm:p-3 space-y-2 shadow-sm">
            <div class="flex items-center justify-between gap-2">
              <select id="studyModuleSelect" class="flex-1 min-w-0 px-3 py-1.5 rounded-xl bg-slate-100 dark:bg-slate-800 text-xs sm:text-sm font-semibold focus:outline-none truncate">
                <option value="__ALL__" ${session.moduleId === null ? 'selected' : ''}>Все блоки (${state.modules.length})</option>
                ${Array.from(new Set(state.modules.map(m => getModuleFolder(m)))).sort().map(fn => `<option value="__FOLDER__:${escapeHtml(fn)}" ${session.moduleId === '__FOLDER__:' + fn ? 'selected' : ''}>📂 Папка: ${escapeHtml(fn)}</option>`).join('')}
                ${state.modules.map(m => `<option value="${m.id}" ${m.id === session.moduleId ? 'selected' : ''}>${escapeHtml(m.title)}</option>`).join('')}
              </select>
              <div class="flex items-center gap-0.5 bg-slate-100 dark:bg-slate-800 p-1 rounded-xl shrink-0">
                ${[
                  { id: 'all', label: 'Умный' },
                  { id: 'errors', label: 'Ошибки' },
                  { id: 'favorites', label: '★' },
                  { id: 'new', label: 'Новые' }
                ].map(sc => `
                  <button data-scope="${sc.id}" class="tap-scale px-2 py-1 rounded-lg text-[11px] sm:text-xs font-semibold transition ${session.scope === sc.id ? 'bg-white dark:bg-slate-700 shadow-sm text-indigo-600 dark:text-indigo-300' : 'text-slate-500 hover:text-slate-800 dark:hover:text-slate-200'}">${sc.label}</button>
                `).join('')}
              </div>
            </div>

            <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar pb-0.5">
              ${availableModes.map(md => `
                <button data-mode="${md.id}" title="${md.name}" class="tap-scale shrink-0 px-3 py-1.5 rounded-xl text-xs font-semibold transition ${session.mode === md.id ? 'bg-indigo-600 text-white shadow-sm' : 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300'}">${md.icon} <span>${md.name}</span></button>
              `).join('')}
            </div>
          </div>

          <!-- Card Arena -->
          <div id="studyArena" style="zoom: ${(getCfg().fontScale || 100) / 100}" class="rounded-3xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900/80 p-5 sm:p-8 shadow-xl shadow-slate-950/5"></div>
        </div>
      `;

      root.querySelector('#studyModuleSelect').addEventListener('change', (e) => {
        session.moduleId = e.target.value === '__ALL__' ? null : e.target.value;
        session.currentItem = null;
        renderStudyView(root);
      });
      root.querySelectorAll('[data-scope]').forEach(b => b.addEventListener('click', () => {
        session.scope = b.dataset.scope;
        session.currentItem = null;
        renderStudyView(root);
      }));
      root.querySelectorAll('[data-mode]').forEach(b => b.addEventListener('click', () => {
        session.mode = b.dataset.mode;
        renderStudyView(root);
      }));

      const arena = root.querySelector('#studyArena');
      if (!picked) {
        const emptyMsg = session.scope === 'errors'
          ? { icon: '🏆', title: 'Все ошибки отработаны!', desc: 'Активных ошибок больше нет. Отличная работа — переключись на «Умный» режим для новых слов.' }
          : { icon: '🎉', title: 'В этой выборке нет карточек', desc: 'Попробуй переключить фильтр на «Умный» или выбери другой режим.' };
        arena.innerHTML = `
          <div class="text-center py-10 space-y-3">
            <div class="text-4xl">${emptyMsg.icon}</div>
            <div class="text-lg font-bold">${emptyMsg.title}</div>
            <p class="text-xs sm:text-sm text-slate-500 max-w-md mx-auto">${emptyMsg.desc}</p>
            ${session.scope !== 'all' ? `<button id="switchSmartBtn" class="mt-2 px-4 py-2 rounded-xl bg-indigo-600 text-white text-xs font-semibold">Перейти в «Умный» режим</button>` : ''}
          </div>
        `;
        const sw = arena.querySelector('#switchSmartBtn');
        if (sw) sw.addEventListener('click', () => { session.scope = 'all'; renderStudyView(root); });
        return;
      }

      const st = getItemStat(picked.moduleId, picked.item.id);
      const modeDef = ModeRegistry.get(session.mode);

      arena.innerHTML = `
        <div class="flex items-center justify-between gap-2 pb-4 mb-5 border-b border-slate-100 dark:border-slate-800/80 text-xs">
          <div class="flex items-center flex-wrap gap-2 text-slate-400">
            <span class="truncate max-w-[130px] sm:max-w-xs">${escapeHtml(picked.moduleTitle)}</span>
            <span class="px-2 py-0.5 rounded-full bg-amber-500/15 text-amber-500 font-semibold">🔥 Серия: ${session.sessionStreak}</span>
            ${isReviewInjection ? `<span class="px-2 py-0.5 rounded-full bg-violet-500/15 text-violet-400 font-semibold">🔄 Повторение старого</span>` : ''}
            ${st.activeError > 0 ? `<span class="px-2 py-0.5 rounded-full bg-rose-500/15 text-rose-500 font-semibold">До закрытия ошибки: ${st.activeError}</span>` : ''}
            ${st.streak > 0 && st.activeError === 0 ? `<span class="px-2 py-0.5 rounded-full bg-emerald-500/15 text-emerald-500 font-semibold">Верно: ${st.streak}/${MASTERY_STREAK}</span>` : ''}
          </div>
          <button id="favToggleBtn" title="В избранное (F)" class="p-1.5 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 transition text-lg leading-none ${st.favorite ? 'text-amber-400' : 'text-slate-400'}">
            ${st.favorite ? '★' : '☆'}
          </button>
        </div>
        <div id="modeStage"></div>
      `;

      const favBtn = arena.querySelector('#favToggleBtn');
      const doFav = () => {
        const nowFav = toggleFavorite(picked.moduleId, picked.item.id);
        favBtn.textContent = nowFav ? '★' : '☆';
        favBtn.className = `p-1.5 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 transition text-lg leading-none ${nowFav ? 'text-amber-400' : 'text-slate-400'}`;
      };
      favBtn.addEventListener('click', doFav);

      const modeKeyHandler = modeDef.render(arena.querySelector('#modeStage'), {
        item: picked.item,
        moduleId: picked.moduleId,
        moduleItems: picked.moduleItems,
        onComplete: () => renderStudyView(root)
      });

      session.keyHandler = (e) => {
        if (document.activeElement && ['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement.tagName)) return;
        if (e.key.toLowerCase() === 'f' || e.key.toLowerCase() === 'а') {
          doFav();
          return;
        }
        if (modeKeyHandler) modeKeyHandler(e.key);
      };
    }

    // --- VIEW: ERRORS ---
    let errorViewTab = 'active'; // 'active' | 'archive'
    function renderErrorsView(root) {
      const activeList = [];
      const archiveList = [];
      for (const m of state.modules) {
        for (const it of m.items) {
          const st = getItemStat(m.id, it.id);
          if (st.activeError > 0) activeList.push({ module: m, item: it, stat: st });
          else if (st.totalErrors > 0) archiveList.push({ module: m, item: it, stat: st });
        }
      }

      root.querySelectorAll('[data-fav-err]').forEach(b => b.addEventListener('click', () => {

    // --- VIEW: FAVORITES ---
    function renderFavoritesView(root) {

      for (const m of state.modules) {

          `}

      `;

      const drillBtn = root.querySelector('#drillFavsBtn');
      if (drillBtn) drillBtn.addEventListener('click', () => startStudy({ moduleId: null, scope: 'favorites' }));

        pickerFilter = 'favorites';
        pickerSelected.clear();
        favList.forEach(({ module, item }) => pickerSelected.add(`${module.id}::${item.id}`));

        render();
      });
      root.querySelectorAll('[data-unfav]').forEach(b => b.addEventListener('click', () => {
        const [mId, iId] = b.dataset.unfav.split('::');
        toggleFavorite(mId, iId);
        renderFavoritesView(root);
      }));
    }

    // --- VIEW: BUILDER (Manual + Selection from Existing Words) ---
    let builderMode = 'from_existing'; // 'from_existing' | 'manual'
    let builderDraft = { title: '', category: 'Русский язык', description: '', items: [] };
    let builderStressIdx = -1;

    let pickerSourceMod = '__ALL__';
    let pickerFilter = 'all'; // 'all' | 'favorites' | 'errors' | 'unseen'
    let pickerQuery = '';
    let pickerLimit = 80;
    const pickerSelected = new Set(); // "moduleId::itemId"

    function renderBuilderView(root) {
      root.innerHTML = `
        <div class="max-w-3xl mx-auto space-y-5 card-enter">
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">

        return;

      const allItems = [];
      const itemMap = new Map();
      for (const m of state.modules) {
        for (const it of m.items) {
          const key = `${m.id}::${it.id}`;
          const st = getItemStat(m.id, it.id);
          const entry = { key, module: m, item: it, stat: st };
          itemMap.set(key, entry);
          if (pickerSourceMod !== '__ALL__' && m.id !== pickerSourceMod) continue;
          if (pickerFilter === 'favorites' && !st.favorite) continue;
          if (pickerFilter === 'errors' && st.activeError === 0 && st.totalErrors === 0) continue;
          if (pickerFilter === 'unseen' && st.attempts > 0) continue;
          if (pickerQuery) {
            const q = pickerQuery.toLowerCase();
            if (!it.front.toLowerCase().includes(q) && !it.back.toLowerCase().includes(q) && !(it.fullAnswer || '').toLowerCase().includes(q) && !(it.explanation || '').toLowerCase().includes(q)) continue;

          allItems.push(entry);
        }
      }

      const visible = allItems.slice(0, pickerLimit);

      stage.innerHTML = `
        <div class="space-y-4">

              <div>
                <label class="text-xs font-semibold text-slate-500 block mb-1">Категория</label>

              </div>
            </div>
            <div class="flex flex-wrap items-center justify-between gap-2 pt-1">

              <div class="flex gap-2">
                <button id="exportPickedBtn" class="px-3.5 py-2 rounded-xl border border-slate-300 dark:border-slate-700 text-xs font-semibold hover:bg-slate-100 dark:hover:bg-slate-800 transition">⬇️ Скачать .json</button>

              </div>
            </div>
          </div>

          <!-- Filter Bar -->
          <div class="rounded-2xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900/70 p-4 space-y-3">

              <input id="pickerSearch" type="text" value="${escapeHtml(pickerQuery)}" placeholder="Поиск слова или правила..." class="flex-1 px-3.5 py-2 rounded-xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-sm" />
              <select id="pickerModSelect" class="px-3 py-2 rounded-xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-xs sm:text-sm font-medium">

                    <input type="checkbox" data-pick-key="${key}" ${checked ? 'checked' : ''} class="mt-1 rounded text-indigo-600 focus:ring-indigo-500" />

                      <div class="flex items-center gap-2 flex-wrap">
                        <span class="font-bold text-sm text-slate-800 dark:text-slate-100">${escapeHtml(item.fullAnswer ? item.fullAnswer : (item.front.length > 110 ? item.front.slice(0, 110) + '…' : item.front))}</span>
                        ${item.fullAnswer ? `<span class="text-[11px] px-1.5 py-0.5 rounded bg-slate-100 dark:bg-slate-800 text-slate-500">${escapeHtml(item.front)}</span>` : ''}
                        <span class="text-[11px] px-1.5 py-0.5 rounded bg-emerald-500/10 text-emerald-500 font-semibold">${escapeHtml(item.back)}</span>

                        ${stat.activeError > 0 ? `<span class="text-rose-500 text-[11px] font-semibold">ошибка</span>` : ''}
                      </div>
                      ${item.explanation ? `<div class="text-xs text-slate-500 dark:text-slate-400 truncate">${escapeHtml(item.explanation)}</div>` : ''}

              ${allItems.length > pickerLimit ? `
                <button id="loadMorePickerBtn" class="w-full py-2 rounded-xl bg-slate-100 dark:bg-slate-800 text-xs font-semibold text-indigo-500 hover:bg-slate-200 dark:hover:bg-slate-700">Показать ещё (+80 из ${allItems.length - pickerLimit})</button>
              ` : ''}

        renderExistingPicker(stage);

      const lm = stage.querySelector('#loadMorePickerBtn');

      const buildSelectedModule = () => {

        for (const k of pickerSelected) {

        }
        if (!pickedItems.length) { showToast('Выбери хотя бы одно слово', 'warn'); return null; }
        const hasStress = pickedItems.some(i => typeof i.stressIndex === 'number');
        return {
          id: `pack_${Date.now()}`,
          title: builderDraft.title.trim() || `Подборка (${pickedItems.length} слов)`,
          category: builderDraft.category.trim() || 'Свой блок',
          description: `Собран вручную из выбранных карточек (${pickedItems.length} шт.).`,
          version: '1.0',
          supportedModes: hasStress ? ['stress', 'flashcard', 'quiz'] : ['flashcard', 'quiz', 'typing'],
          items: pickedItems

      stage.querySelector('#createPickedBtn').addEventListener('click', () => {
